# Publishes this repository's site to GitHub Pages on every push to main.
# The landing page is landing/ at the site root. face/ is the wallpaper. office/ is the 3D dashboard.
# landing/assemble.mjs lists what goes out (no journal, keys, or source art), including the
# vendored three@0.170.0 tree under office/vendor/three.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: node landing/assemble.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
