<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot HQ UI harness</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./ui.css">
  <style>
    /*
     * The UI over a stand-in for the 3D office (the real scene is edited elsewhere), with a fake state injected.
     * Test URLs:
     *   ?bg=white (default: a white page, soft dark aura) | scene (the real office, wallpaper mode, in an iframe) | dark
     *   ?sel=<bot id>|none   ?floor=<floor id>   ?live=0 (freeze data)   ?shot (hide the dev bar)
     *   ?open=all|none|waiting,finished,routines   (dock cards)   ?blur=1 (the eye on)
     *   ?fin=0 / ?routines=0 (drop those fields, as in the local-server mode; =empty gives empty lists)   ?calm=1 (nobody waits)   ?usage=0 (no usage report, as in bots-only mode)
     */
    html, body { background: #fff; }
    #scene { background: none; cursor: default; }
    #scene .plate { position: absolute; inset: 0; }
    body[data-bg="white"] #scene .plate {
      background:
        radial-gradient(34% 40% at 50% 54%, rgba(20, 24, 40, .16), rgba(20, 24, 40, .06) 55%, transparent 100%),
        #fff;
    }
    body[data-bg="dark"] #scene .plate { background: radial-gradient(70% 70% at 42% 38%, #1B2240, #10162B 55%, #080B18); }
    #scene iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .dev {
      position: fixed; z-index: 30; left: 50%; top: 76px; transform: translateX(-50%) translateX(-70px);
      display: flex; gap: 6px; align-items: center; padding: 4px; border-radius: 999px;
      font: 700 12px/1 "Nunito", system-ui, sans-serif; color: #B4B4BA;
    }
    .dev button { font: inherit; color: #F2F2F7; background: none; border: 0; height: 28px; padding: 0 11px; border-radius: 999px; cursor: pointer; }
    .dev button:hover { background: rgba(255, 255, 255, .1); }
    .dev button[aria-pressed="true"] { background: #F2F2F7; color: #232327; }
    .dev .sep { width: 1px; height: 14px; background: rgba(255, 255, 255, .14); }
    .dev label { display: inline-flex; gap: 6px; align-items: center; padding: 0 8px; cursor: pointer; }
    .dev code { font: 11px ui-monospace, Menlo, Consolas, monospace; padding: 0 8px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.shot .dev { display: none; }
  </style>
</head>
<body>
  <main id="scene" aria-label="Office"><div class="plate"></div></main>
  <header id="topbar"></header>
  <nav id="floors"></nav>
  <aside id="panel"></aside>
  <section id="feed"></section>

  <div class="dev bhq-surface" role="toolbar" aria-label="Test bench">
    <button type="button" data-sel="none">Team</button>
    <button type="button" data-sel="x-writer">Bot</button>
    <span class="sep"></span>
    <label><input type="checkbox" id="live"> live data</label>
    <code id="log">no events</code>
  </div>

  <script type="module">
    import { initUI, renderUI } from './ui.js';

    const q = new URLSearchParams(location.search);
    const $log = document.getElementById('log');
    const log = (m) => { $log.textContent = m; };
    if (q.has('shot')) document.body.classList.add('shot');

    // ?still: no transitions or entrance animations, so a screenshot never catches a card mid-move
    if (q.has('still')) { const st = document.createElement('style'); st.textContent = '*,*::before,*::after{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}'; document.head.append(st); }
    const bg = q.get('bg') || 'white';
    document.body.dataset.bg = bg;
    if (bg === 'scene') {
      const f = document.createElement('iframe');
      f.src = '../index.html?mode=wallpaper';
      f.addEventListener('load', () => { try { const st = f.contentDocument.createElement('style'); st.textContent = '.wp-status{display:none!important}'; f.contentDocument.head.append(st); } catch {} });
      document.querySelector('#scene .plate').append(f);
    }

    // --- data
    const STEPS = {
      working: ['writing a post draft', 'collecting data', 'checking sources', 'drawing banner, option 2', 'counting reach of 40 posts', 'sorting new bookmarks', 'matching monthly spend'],
      idle: ['file ready, waiting for a new task', 'stopped, nothing running', 'Friday storm is ready'],
      waiting_user: ['waiting for your reply: which thread?', 'need an ok on the $40 budget', 'need a choice: option A or B'],
      error: ['X limit 429, retry in 15 min', 'page did not open, timeout'],
      done: ['report ready', 'note published'],
    };
    const MIX = ['working', 'working', 'working', 'working', 'idle', 'idle', 'waiting_user', 'error', 'done', 'stuck'];
    const pick = (a) => a[Math.floor(Math.random() * a.length)];

    const res = await fetch('../data/demo-state.json');
    const state = await res.json();
    for (const id of ['x-writer', 'grok-bot', 'codila-x-researcher', 'analytics-analyst', 'trendy-x']) state.bots[id].chat_url = 'grokbot://app/v1/agent?id=' + id;

    // the fields the bots-only mode adds: finished (last 24 h, newest first) and routines (by next run)
    const T0 = Date.parse(state.now);
    const ago = (m) => new Date(T0 - m * 60000).toISOString();
    const inn = (m) => new Date(T0 + m * 60000).toISOString();
    const nm = (id) => state.bots[id].name;
    if (q.get('fin') !== '0') {
      state.finished = [
        ['qt-scout', 'found 6 posts to quote', 4], ['banner-visuals', '3 covers ready for the series', 12],
        ['bookmarks-brain', 'digest of 40 bookmarks sent', 37], ['substack', 'Friday issue assembled', 95],
        ['warren-buffett', 'quarterly notes summarised', 210], ['grok-bot', 'R4: weekly summary posted', 480], ['jevopus', 'reply draft approved', 900],
      ].map(([bot, step, m]) => ({ t: ago(m), bot, name: nm(bot), step }));
    }
    if (q.get('routines') !== '0') {
      state.routines = [
        ['x-writer', 'Morning thread draft', 'every day 09:00', 14], ['competitor-watch', 'Competitor scan', 'every 2 h', 95],
        ['analytics-analyst', 'Weekly reach report', 'Mondays 08:00', 60 * 20], ['bookmarks-brain', 'Bookmarks digest', 'Fridays 18:00', 60 * 30],
      ].map(([bot, routine, schedule, m]) => ({ bot, name: nm(bot), routine, schedule, next_run: inn(m) }));
    }
    if (q.get('fin') === 'empty') state.finished = [];
    if (q.get('routines') === 'empty') state.routines = [];
    if (q.has('calm')) for (const b of Object.values(state.bots)) { if (['waiting_user', 'error', 'stuck'].includes(b.effective_status)) { b.status = b.effective_status = 'working'; } }
    if (q.get('usage') === '0') state.usage.total_used_pct = null;
    if (q.has('pct')) state.usage.total_used_pct = Number(q.get('pct'));

    const ctx = { currentFloor: q.get('floor') || 'x-content', selectedBot: q.get('sel') || null };
    if (ctx.selectedBot === 'none') ctx.selectedBot = null;
    const render = () => renderUI(state, ctx);
    const syncDev = () => document.querySelectorAll('[data-sel]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.sel === 'none') === !ctx.selectedBot)));

    // dock cards: ?open=all | none | a comma list (set before initUI reads localStorage)
    if (q.has('open')) {
      const v = q.get('open');
      const keys = ['waiting', 'finished', 'routines'];
      const on = v === 'all' ? keys : v === 'none' ? [] : v.split(',');
      try { localStorage.setItem('bothq.dock', JSON.stringify(Object.fromEntries(keys.map((k) => [k, on.includes(k)])))); } catch {}
    }
    if (q.has('blur')) { try { localStorage.setItem('bothq.waitBlur', q.get('blur') === '1' ? '1' : '0'); } catch {} }

    initUI({
      onSelectBot: (id) => { ctx.selectedBot = id; log('onSelectBot(' + id + ')'); syncDev(); render(); },
      onSelectFloor: (id) => { ctx.currentFloor = id; ctx.selectedBot = null; log('onSelectFloor(' + id + ')'); syncDev(); render(); },
      onZoom: (dir) => log('onZoom(' + dir + ')'),
      onOpenChat: (id, url) => log('onOpenChat(' + id + ', ' + url + ')'),
    });
    document.querySelectorAll('[data-sel]').forEach((b) => b.addEventListener('click', () => {
      ctx.selectedBot = b.dataset.sel === 'none' ? null : b.dataset.sel;
      if (ctx.selectedBot) ctx.currentFloor = state.bots[ctx.selectedBot].floor;
      syncDev(); render();
    }));
    syncDev();
    render();

    const base = Date.parse(state.now);
    const t0 = Date.now();
    let tick = 0;

    function recount() {
      const sum = { working: 0, idle: 0, waiting_user: 0, error: 0, stuck: 0, done: 0, total: 0 };
      for (const f of state.floors) {
        f.counts = { working: 0, idle: 0, waiting_user: 0, error: 0, stuck: 0, done: 0 };
        for (const id of f.bots) {
          const s = state.bots[id].effective_status;
          f.counts[s]++; sum[s]++; sum.total++;
        }
      }
      state.summary = sum;
    }

    function mutate() {
      tick++;
      state.version++;
      state.now = new Date(base + (Date.now() - t0)).toISOString();
      const id = pick(Object.keys(state.bots));
      const bot = state.bots[id];
      const kind = pick(MIX);
      const status = kind === 'stuck' ? 'working' : kind;
      const step = pick(STEPS[status]);
      if (bot.effective_status !== kind) bot.since = state.now;
      bot.status = status;
      bot.effective_status = kind;
      bot.step = step;
      bot.last_event = state.now;
      bot.today.events++;
      bot.history.unshift({ t: state.now, status, step });
      bot.history.length = Math.min(bot.history.length, 20);
      state.feed.unshift({ t: state.now, bot: id, name: bot.name, status, step });
      state.feed.length = Math.min(state.feed.length, 100);
      if (state.usage.total_used_pct != null && tick % 20 === 0) { state.usage.total_used_pct = Math.min(100, state.usage.total_used_pct + 1); state.usage.updated_at = state.now; }
      recount();
    }

    const live = document.getElementById('live');
    live.checked = q.get('live') !== '0';
    setInterval(() => {
      if (live.checked) mutate();
      render();
    }, 1000);

    window.__harness = { state, ctx, mutate, render };
  </script>
</body>
</html>
